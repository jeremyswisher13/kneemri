<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- .ico first for legacy clients that request /favicon.ico unprompted; without
         a real file firebase.json's ** rewrite hands them the SPA HTML shell. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- No <link rel="canonical"> on purpose. firebase.json rewrites ** to this one
         index.html, so anything here is served byte-identical on every route; a
         hardcoded canonical therefore told crawlers that /privacy, /support and
         every /courses/* URL were duplicates of "/". Rewriting it per-route from
         JS would not fix that either: every /courses/* route sits behind
         ProtectedRoute, which redirects a signed-out crawler to /login before the
         layout that would rewrite the tag ever mounts. With no tag at all each URL
         is self-canonical, which is the correct claim for the only publicly
         reachable pages (/, /login, /privacy, /support, /accessibility). Re-add a
         canonical only if this app grows a prerendered/server-rendered public
         surface that can emit a genuinely per-URL value. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#005587" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sports MRI" />
    <!-- black-translucent lets the standalone web view extend under the status bar,
         which is what the viewport-fit=cover + env(safe-area-inset-top) padding in
         the layouts already assumes. With "default" iOS reserves an opaque status
         bar, leaving a seam above the branded header. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sports MRI Academy</title>
    <meta name="description" content="Interactive, case-based knee, shoulder, hip, and elbow MRI training for sports medicine fellows and residents." />

    <!-- Open Graph (iMessage, Facebook, LinkedIn, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sports MRI Academy" />
    <meta property="og:title" content="Sports MRI Academy" />
    <meta property="og:description" content="Interactive, case-based knee, shoulder, hip, and elbow MRI training for sports medicine fellows and residents." />
    <meta property="og:url" content="https://sportsmriacademy.com/" />
    <meta property="og:image" content="https://sportsmriacademy.com/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://sportsmriacademy.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sports MRI Academy — knee, shoulder, hip, and elbow MRI training for sports medicine" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sports MRI Academy" />
    <meta name="twitter:description" content="Interactive, case-based knee, shoulder, hip, and elbow MRI training for sports medicine fellows and residents." />
    <meta name="twitter:image" content="https://sportsmriacademy.com/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
